name: Test - Security-SecretScan

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/trufflehog-secret-scan.yml'
      - '.github/workflows/trufflehog-secret-scan-test.yml'

concurrency:
  group: secret-scan-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  run:
    name: Run
    permissions:
      contents: read
      pull-requests: write # required to upsert the findings comment
    uses: ./.github/workflows/trufflehog-secret-scan.yml
